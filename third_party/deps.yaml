# 全局三方库清单 —— 唯一事实来源。
# 项目侧只通过 deps.yaml 的 `use` 列表引用这里的库名。
default_variant: release
variants: [release, debug]

libs:
  fmt:
    repo: https://github.com/fmtlib/fmt.git
    tag: "10.2.1"
    build: cmake
    options: [FMT_TEST=OFF]
  glm:
    repo: https://github.com/g-truc/glm.git
    tag: "1.0.1"
    build: cmake
    # master project 默认 GLM_BUILD_TESTS=ON,会把 372 个测试目标全编一遍——
    # MSVC 下某个测试编译失败(Windows 实测 4 个 FAILED 之二)。消费方只用库,
    # 关掉测试只编 glm 库 + install。
    options: [GLM_BUILD_TESTS=OFF]
  abseil-cpp:
    repo: https://github.com/abseil/abseil-cpp.git
    tag: "20260817.0"
    build: cmake
    options: [ABSL_BUILD_TESTING=OFF, CMAKE_CXX_STANDARD=20]
  ink-stroke-modeler:
    repo: https://github.com/google/ink-stroke-modeler.git
    tag: "main"
    build: cmake
    # FIND_GTEST=OFF 时 ink 的 CMakeLists 用 FetchContent 直连 GitHub 拉 googletest,
    # Windows 常连不上(Recv failure/Failed to connect)→ configure 崩。cmake_driver 会
    # 把 FETCHCONTENT_SOURCE_DIR_GOOGLETEST 指到池内(镜像拉好的)googletest 源码;这里
    # depends_on googletest 保证它在 ink 之前先被拉取(否则新机器上 ink 先 configure,
    # 池里还没有 googletest 源码)。
    options: [INK_STROKE_MODELER_FIND_DEPENDENCIES=ON, INK_STROKE_MODELER_FIND_ABSL=ON, INK_STROKE_MODELER_FIND_GTEST=OFF, INK_STROKE_MODELER_BUILD_TESTING=OFF]
    depends_on: [abseil-cpp, googletest]
  glfw:
    repo: https://github.com/glfw/glfw.git
    tag: "3.4"
    build: cmake
    options: [GLFW_BUILD_EXAMPLES=OFF, GLFW_BUILD_TESTS=OFF, GLFW_BUILD_DOCS=OFF, GLFW_BUILD_WAYLAND=OFF]
  googletest:
    repo: https://github.com/google/googletest.git
    tag: "v1.15.2"
    build: cmake
    # googletest 的 internal_utils.cmake 在 MSVC + 静态库且 gtest_force_shared_crt 未开时,
    # 会把 /MD 强换成 -MT(无视 cmake_driver 传的 CMAKE_MSVC_RUNTIME_LIBRARY)。消费方
    # (EasyPainter 测试目标 / Qt 预编译)都是动态 CRT /MD → gtest.lib MT 与之相链即
    # LNK2038 RuntimeLibrary 不匹配 + LNK2005 重复符号。开共享 CRT 让 gtest 池产物归 /MD。
    options: [gtest_force_shared_crt=ON]
  swiftshader:
    repo: https://github.com/google/swiftshader.git
    tag: "master"
    build: cmake
    options: [SWIFTSHADER_BUILD_TESTS=OFF, SWIFTSHADER_BUILD_HEADLESS=OFF, SWIFTSHADER_BUILD_VULKAN=ON]
